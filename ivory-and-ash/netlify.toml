# Deploy this folder as its own Netlify site: set "Base directory" to ivory-and-ash.
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Send anyone who lands on Netlify's own address to the real domain.
[[redirects]]
  from = "https://ivory-and-ash-painting.netlify.app/*"
  to = "https://ivoryandashpainting.com/:splat"
  status = 301
  force = true
